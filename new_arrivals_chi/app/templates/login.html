<!--
Project: new_arrivals_chi
File name: login.html
Associated Files:
    base.html, main.py

Skeleton HTML for user login page.

References: https://www.digitalocean.com/community/tutorials/how-to-add-authentication-to-your-app-with-flask-login
-->

{% extends "base.html" %}
{% block content %}
<div id="buttonContainer" class="button-container">
    <div class="text-container" style="text-align: center;">
        <h3 class="box-title">{{ translations[language]['util']['login'] | escape }}</h3>
        <div class="button-group">
            {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="notification is-danger">
                    {{ messages[0] | escape }}
                </div>
            {% endif %}
            {% endwith %}
            <form method="POST" action="/login">
                <div class="field">
                    <div class="control">
                        <input class="input-login" type="email" name="email" placeholder="{{ translations[language]['login']['email'] | escape }}" autofocus="">
                    </div>
                </div>

                <div class="field">
                    <div class="control">
                        <input class="input-login" type="password" name="password" placeholder="{{ 'Password' if language == 'en' else 'Contraseña' | escape }}" oncopy="return false" oncut="return false" onpaste="return false">
                    </div>
                </div>
                <button class="btn btn-primary btn-login">{{ translations[language]['util']['login'] | escape }}</button>
            </form>
        </div>
        </div>
    </div>
</div>
{% endblock %}
