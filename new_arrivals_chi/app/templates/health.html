<!--
Project: new_arrivals_chi
File name: health.html
Associated Files:
    base.html, main.py

Landing page for user to navigate through health information.
-->

{% extends "base.html" %}
{% block content %}

<style>
  .btn-primary {
    width: 100%;
    font-size: large;
  }
</style>

  <div class="text-container">
   <h1>{{ translations[language]['health']['health_information'] }}</h1>
  </div>

    
      <div class="container-fluid">    
        <div class="container mt-4">
          <h2>{{ translations[language]['util']['i_want_to'] | escape }}</h2>
          <div class="row">
            <div class="col-lg-4 text-center" style="padding-top: 10px;">
              <button class="btn btn-primary" onclick="navigateTo('/health/search', '{{ language | escape }}')">
                {{ translations[language]['health']['receive_assistance'] | escape }}
              </button>
            </div>
            <div class="col-lg-4 text-center" style="padding-top: 10px;">
              <button class="btn btn-primary" onclick="navigateTo('/health_general', '{{ language | escape }}')">
                {{ translations[language]['health']['learn_more'] | escape }}
              </button>
            </div>
            <div class="col-lg-4 text-center" style="padding-top: 10px;">
              <button class="btn btn-primary" onclick="location.href='{{ '/' | escape }}'">
                  {{ translations[language]['util']['back'] | escape }}
              </button>
            </div>
        </div>
    </div>
  </div>
{% endblock %}
